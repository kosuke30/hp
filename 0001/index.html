<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>0001 ホームページ</title>
<style>
  :root {
    --accent: #2563eb;
    --bg: #ffffff;
    --bg-soft: #f7f7f8;
    --text: #1a1a1a;
    --text-soft: #555555;
    --border: #e5e5e5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    color: var(--text);
    background: var(--bg);
    line-height: 1.7;
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px;
  }
  header.hero {
    background: var(--bg-soft);
    padding: 96px 0 72px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  header.hero h1 {
    font-size: 2.6rem;
    font-weight: 800;
    margin: 0 0 12px;
    letter-spacing: 0.02em;
  }
  header.hero p.catch {
    font-size: 1.15rem;
    color: var(--text-soft);
    margin: 0;
    font-weight: 500;
  }
  section {
    padding: 56px 0;
    border-bottom: 1px solid var(--border);
  }
  section:last-of-type {
    border-bottom: none;
  }
  h2 {
    font-size: 1.3rem;
    font-weight: 700;
    margin: 0 0 24px;
    position: relative;
    padding-left: 14px;
  }
  h2::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0.15em;
    bottom: 0.15em;
    width: 4px;
    background: var(--accent);
    border-radius: 2px;
  }
  p.description {
    font-size: 1.05rem;
    color: var(--text);
    white-space: pre-wrap;
  }
  dl.info {
    display: grid;
    grid-template-columns: 120px 1fr;
    gap: 12px 16px;
    margin: 0;
  }
  dl.info dt {
    font-weight: 600;
    color: var(--text-soft);
  }
  dl.info dd {
    margin: 0;
  }
  .btn {
    display: inline-block;
    padding: 12px 28px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.95rem;
    transition: opacity 0.2s;
  }
  .btn:hover {
    opacity: 0.85;
  }
  .btn.outline {
    background: transparent;
    color: var(--accent);
    border: 2px solid var(--accent);
  }
  .contact-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 20px;
  }
  footer {
    text-align: center;
    padding: 40px 0;
    color: var(--text-soft);
    font-size: 0.85rem;
    background: var(--bg-soft);
  }
  @media (max-width: 480px) {
    header.hero { padding: 64px 0 48px; }
    header.hero h1 { font-size: 2rem; }
    dl.info { grid-template-columns: 90px 1fr; }
  }
</style>
</head>
<body>

  <header class="hero">
    <div class="container">
      <h1>0001</h1>
      <p class="catch">何でも屋</p>
    </div>
  </header>

  <section>
    <div class="container">
      <h2>紹介</h2>
      <p class="description">テスト</p>
    </div>
  </section>

  <section>
    <div class="container">
      <h2>営業時間・お問い合わせ先</h2>
      <dl class="info">
        <dt>営業時間</dt>
        <dd>11:30～19:30</dd>
        <dt>メール</dt>
        <dd><a href="mailto:xxx@yahoo.co.jp" style="color: var(--accent); text-decoration: none;">xxx@yahoo.co.jp</a></dd>
      </dl>
    </div>
  </section>

  <section>
    <div class="container">
      <h2>お問い合わせ</h2>
      <div class="contact-actions">
        <a class="btn" href="mailto:xxx@yahoo.co.jp">メールを送る</a>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      0001 — 発行日: 2026-08-04
    </div>
  </footer>

</body>
</html>
