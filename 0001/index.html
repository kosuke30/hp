<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>0001 ホームページ</title>
<style>
  :root {
    --accent: #2563eb;
    --bg: #ffffff;
    --bg-soft: #f7f7f8;
    --text: #1a1a1a;
    --text-soft: #555555;
    --border: #e5e5e5;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    color: var(--text);
    background: var(--bg);
    line-height: 1.7;
  }
  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* Header / Nav */
  header.site-header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--border);
  }
  .site-header .container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 12px;
    padding-bottom: 12px;
  }
  .site-header .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 1.05rem;
  }
  .site-header .brand img {
    width: 34px;
    height: 34px;
    object-fit: cover;
    border-radius: 50%;
  }
  .site-header nav {
    display: flex;
    gap: 20px;
  }
  .site-header nav a {
    color: var(--text-soft);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 600;
  }
  .site-header nav a:hover {
    color: var(--accent);
  }

  /* Hero with background image */
  section.hero {
    position: relative;
    height: 60vh;
    min-height: 380px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border-bottom: 1px solid var(--border);
  }
  section.hero img.hero-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  section.hero .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.55));
  }
  section.hero .hero-content {
    position: relative;
    z-index: 2;
    text-align: center;
    color: #fff;
    padding: 0 24px;
  }
  section.hero h1 {
    font-size: 2.8rem;
    font-weight: 800;
    margin: 0 0 12px;
    letter-spacing: 0.02em;
    text-shadow: 0 2px 12px rgba(0,0,0,0.4);
  }
  section.hero p.catch {
    font-size: 1.2rem;
    margin: 0;
    font-weight: 500;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }

  section {
    padding: 56px 0;
    border-bottom: 1px solid var(--border);
  }
  section:last-of-type {
    border-bottom: none;
  }
  h2 {
    font-size: 1.3rem;
    font-weight: 700;
    margin: 0 0 24px;
    position: relative;
    padding-left: 14px;
  }
  h2::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0.15em;
    bottom: 0.15em;
    width: 4px;
    background: var(--accent);
    border-radius: 2px;
  }
  p.description {
    font-size: 1.05rem;
    color: var(--text);
    white-space: pre-wrap;
    margin: 0;
  }

  /* Concept 2-column */
  .concept-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
    align-items: center;
  }
  .concept-grid img {
    width: 100%;
    border-radius: 14px;
    object-fit: cover;
    aspect-ratio: 4 / 3;
  }
  @media (max-width: 640px) {
    .concept-grid { grid-template-columns: 1fr; }
  }

  dl.info {
    display: grid;
    grid-template-columns: 120px 1fr;
    gap: 12px 16px;
    margin: 0;
  }
  dl.info dt {
    font-weight: 600;
    color: var(--text-soft);
  }
  dl.info dd {
    margin: 0;
  }

  .menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }
  .menu-card {
    position: relative;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    background: var(--bg-soft);
  }
  .menu-card .badge {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  .menu-card .item-name {
    font-weight: 700;
    font-size: 1.05rem;
    margin: 0 0 6px;
  }
  .menu-card .item-price {
    color: var(--accent);
    font-weight: 700;
    margin: 0;
  }

  .btn {
    display: inline-block;
    padding: 12px 28px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.95rem;
    transition: opacity 0.2s;
  }
  .btn:hover {
    opacity: 0.85;
  }
  .contact-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 20px;
  }

  footer {
    text-align: center;
    padding: 40px 0;
    color: var(--text-soft);
    font-size: 0.85rem;
    background: var(--bg-soft);
  }
  footer img.footer-logo {
    width: 40px;
    height: 40px;
    object-fit: cover;
    border-radius: 50%;
    margin-bottom: 10px;
  }
  footer .footer-name {
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
  }

  @media (max-width: 480px) {
    section.hero { height: 50vh; min-height: 300px; }
    section.hero h1 { font-size: 2rem; }
    dl.info { grid-template-columns: 90px 1fr; }
    .site-header nav { gap: 12px; }
    .site-header nav a { font-size: 0.8rem; }
  }
</style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <div class="brand">
        <img src="../../../../data/attachments/2026/08/a57e4b929bd24d07.jpg" alt="0001 ロゴ">
        <span>0001</span>
      </div>
      <nav>
        <a href="#menu">メニュー</a>
        <a href="#access">アクセス</a>
        <a href="#contact">お問い合わせ</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <img class="hero-bg" src="../../../../data/attachments/2026/08/b54207221f6b48a0.jpg" alt="0001">
    <div class="overlay"></div>
    <div class="hero-content">
      <h1>0001</h1>
      <p class="catch">何でも屋</p>
    </div>
  </section>

  <section id="concept">
    <div class="container">
      <h2>私たちのこだわり</h2>
      <div class="concept-grid">
        <p class="description">テスト</p>
        <img src="../../../../data/attachments/2026/08/63c589a37e5c4496.jpg" alt="0001の写真">
      </div>
    </div>
  </section>

  <section id="access">
    <div class="container">
      <h2>アクセス</h2>
      <dl class="info">
        <dt>営業時間</dt>
        <dd>11:30～19:30</dd>
        <dt>住所</dt>
        <dd>住所</dd>
        <dt>電話番号</dt>
        <dd>電話番号</dd>
      </dl>
    </div>
  </section>

  <section id="menu">
    <div class="container">
      <h2>メニュー・商品一覧</h2>
      <div class="menu-grid">
        <div class="menu-card">
          <span class="badge">人気</span>
          <p class="item-name">品名</p>
          <p class="item-price">¥100</p>
        </div>
      </div>
    </div>
  </section>

  <section id="contact">
    <div class="container">
      <h2>お問い合わせ</h2>
      <div class="contact-actions">
        <a class="btn" href="tel:電話番号">電話をかける</a>
        <a class="btn" href="mailto:xxx@yahoo.co.jp">メールを送る</a>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <img class="footer-logo" src="../../../../data/attachments/2026/08/a57e4b929bd24d07.jpg" alt="0001 ロゴ">
      <div class="footer-name">0001</div>
      発行日: 2026-08-06
    </div>
  </footer>

</body>
</html>
